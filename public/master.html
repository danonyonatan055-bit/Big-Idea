<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mis negocios</title>
<style>
:root { --bg:#eef3f1; --surface:#fff; --ink:#12302b; --muted:#5b716c; --line:#d3dfdb; --accent:#0c6b5d; --good:#1f7a3d; --good-bg:#dcf1e2; --bad:#a3271f; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, "Segoe UI", sans-serif; }
.wrap { max-width:720px; margin:0 auto; padding:24px 16px 48px; display:flex; flex-direction:column; gap:18px; }
h1 { font-size:1.5rem; margin:0; }
h2 { font-size:1.05rem; margin:0; }
p.hint { margin:0; color:var(--muted); font-size:.92rem; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:10px; }
label { font-weight:600; font-size:.95rem; }
input, textarea, select { font:inherit; width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
textarea { min-height:120px; resize:vertical; }
.row { display:flex; gap:10px; flex-wrap:wrap; }
.row > * { flex:1; min-width:140px; }
button { font:inherit; font-weight:600; padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
button:disabled { opacity:.5; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { font-size:.9rem; font-weight:600; padding:4px 10px; border-radius:999px; background:var(--good-bg); color:var(--good); }
.chip.taken { background:#e6ecea; color:var(--muted); text-decoration:line-through; }
ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
li { border:1px solid var(--line); border-left:4px solid var(--good); border-radius:8px; padding:8px 12px; }
li small { color:var(--muted); display:block; }
#status, #emailStatus { min-height:1.4em; font-weight:600; }
#status.bad, #emailStatus.bad { color:var(--bad); }
#status.ok, #emailStatus.ok { color:var(--good); }
[hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mis negocios</h1>

  <form id="login" class="card" autocomplete="off">
    <label for="pw">Contraseña maestra</label>
    <input id="pw" type="password" required>
    <button type="submit">Entrar</button>
  </form>

  <div id="panel" hidden style="display:flex;flex-direction:column;gap:18px">
    <section class="card">
      <h2>Negocios conectados</h2>
      <ul id="list"></ul>
    </section>

    <section class="card">
      <h2>Agregar un negocio</h2>
      <p class="hint">Cada negocio tiene su número de WhatsApp, su página y su contraseña. Sus precios y citas no se mezclan con los de otros.</p>
      <label for="name">Nombre del negocio</label>
      <input id="name" type="text" placeholder="Clínica Sonrisa">
      <label for="phoneId">ID del número de WhatsApp (Phone number ID de Meta)</label>
      <input id="phoneId" type="text" inputmode="numeric" placeholder="1497230106804439">
      <label for="owners">WhatsApp del encargado, con código de país (opcional)</label>
      <input id="owners" type="text" inputmode="numeric" placeholder="50760000000">
      <p class="hint">Desde ese número el encargado puede escribir "Mañana: 9, 12 y 1" para cargar las horas.</p>
      <label for="bpw">Contraseña para la página del negocio (mínimo 8 caracteres)</label>
      <input id="bpw" type="password" autocomplete="new-password">
      <label for="token">Token de WhatsApp propio del negocio (opcional)</label>
      <input id="token" type="password" autocomplete="off" placeholder="Vacío = usa el token general">
      <button id="create" type="button">Agregar negocio</button>
      <div id="status" role="status"></div>
    </section>
  </div>
</div>

<script>
(function () {
  var pw = "";
  var $ = function (id) { return document.getElementById(id); };
  function say(msg, kind) { $("status").textContent = msg; $("status").className = kind || ""; }

  function api(method, body) {
    return fetch("/api/master", {
      method: method,
      headers: { "x-admin-password": pw, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.error || "No se pudo guardar.");
        return j;
      });
    });
  }

  function render(d) {
    var list = $("list");
    list.textContent = "";
    d.businesses.forEach(function (b) {
      var li = document.createElement("li");
      var top = document.createElement("b");
      top.textContent = b.name + (b.active ? "" : " (apagado)");
      var sub = document.createElement("small");
      sub.textContent = "Código: " + b.id + " · Número ID: " + (b.phoneId || "sin número") + (b.owners ? " · Encargado: +" + b.owners : "");
      var link = document.createElement("a");
      link.href = b.id === "demo" ? "/admin" : b.panel;
      link.textContent = "Abrir su página";
      li.appendChild(top); li.appendChild(sub); li.appendChild(link);
      if (b.id !== "demo") {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.style.marginLeft = "12px";
        btn.textContent = b.active ? "Apagar" : "Encender";
        btn.addEventListener("click", function () {
          api("POST", { action: "update", id: b.id, active: !b.active }).then(render).catch(function (e) { say(e.message, "bad"); });
        });
        li.appendChild(btn);
      }
      list.appendChild(li);
    });
  }

  $("login").addEventListener("submit", function (e) {
    e.preventDefault();
    pw = $("pw").value;
    api("GET").then(function (d) {
      $("login").hidden = true;
      $("panel").hidden = false;
      render(d);
    }).catch(function (err) { pw = ""; $("pw").value = ""; $("pw").placeholder = err.message; });
  });

  $("create").addEventListener("click", function () {
    say("Guardando…");
    api("POST", { action: "create", name: $("name").value, phoneId: $("phoneId").value, owners: $("owners").value,
      password: $("bpw").value, token: $("token").value })
      .then(function (d) {
        render(d);
        ["name", "phoneId", "owners", "bpw", "token"].forEach(function (id) { $(id).value = ""; });
        say("Negocio agregado. Su página aparece en la lista de arriba.", "ok");
      })
      .catch(function (err) { say(err.message, "bad"); });
  });
})();
</script>
</body>
</html>
